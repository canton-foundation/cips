<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="586" viewBox="0 0 1000 586" role="img">
<title>The contracts of one data set and what the operator sees of them</title>
<desc>Above the line, the contracts the operator signs: the data definition, the canonical verifier, the round head, the rounds with their root capsules and the root license; the sublicenses it observes. Below the line, what it never sees: the distributed capsules, the consumer's own verifier and the consumer's checks, which read the round as a view.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; dominant-baseline: central; text-anchor: middle; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; }
rect { stroke-width: 0.5; }
.signed rect { fill: #AE0822; stroke: #950017; } .signed .th { fill: #FFFFFF; } .signed .ts { fill: #FFE3E3; }
.seen rect { fill: #FFE3E3; stroke: #E41939; } .seen .th { fill: #3D0309; } .seen .ts { fill: #AE0822; }
.hidden rect { fill: #F7F7F7; stroke: #D9D9D9; } .hidden .th { fill: #3D0309; } .hidden .ts { fill: #6F6B6B; }
.ex rect { fill: none; stroke: #E41939; stroke-dasharray: 4 4; } .ex .th { fill: #AE0822; } .ex .ts { fill: #6F6B6B; }
.note { text-anchor: start; font-size: 12px; fill: #6F6B6B; }
.band { text-anchor: start; font-size: 13px; font-weight: 500; fill: #3D0309; }
.arr { stroke: #AE0822; stroke-width: 1.5; fill: none; }
.view { stroke: #AE0822; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
.sep { stroke: #BDBDBD; stroke-width: 1; stroke-dasharray: 6 4; }
.dots { font-size: 16px; fill: #AE0822; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#AE0822" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="1000" height="586" fill="#FFFFFF" stroke="none"/>
<g class="signed"><rect x="40" y="50" width="150" height="56" rx="8"/>
<text class="th" x="115.0" y="69.0">DataDefinition</text>
<text class="ts" x="115.0" y="88.0">the data set's identity</text>
</g>
<g class="signed"><rect x="250" y="50" width="150" height="56" rx="8"/>
<text class="th" x="325.0" y="69.0">RoundHead</text>
<text class="ts" x="325.0" y="88.0">the publishing endpoint</text>
</g>
<g class="signed"><rect x="470" y="50" width="120" height="56" rx="8"/>
<text class="th" x="530.0" y="69.0">Round 1</text>
<text class="ts" x="530.0" y="88.0">time, hash, no price</text>
</g>
<g class="signed"><rect x="640" y="50" width="120" height="56" rx="8"/>
<text class="th" x="700.0" y="69.0">Round 2</text>
<text class="ts" x="700.0" y="88.0">time, hash, no price</text>
</g>
<g class="signed"><rect x="810" y="50" width="120" height="56" rx="8"/>
<text class="th" x="870.0" y="69.0">Round 3</text>
<text class="ts" x="870.0" y="88.0">time, hash, no price</text>
</g>
<text class="dots" x="965" y="78">…</text>
<line x1="590" y1="78" x2="637" y2="78" class="arr" marker-end="url(#arrow)"/>
<line x1="760" y1="78" x2="807" y2="78" class="arr" marker-end="url(#arrow)"/>
<path d="M400 62 L420 62 L420 30 L870 30 L870 47" class="arr" marker-end="url(#arrow)"/>
<text class="note" x="426" y="22">latest</text>
<g class="signed"><rect x="40" y="170" width="150" height="56" rx="8"/>
<text class="th" x="115.0" y="189.0">Verifier (canonical)</text>
<text class="ts" x="115.0" y="208.0">the oracle's rules</text>
</g>
<line x1="115" y1="106" x2="115" y2="167" class="arr" marker-end="url(#arrow)"/>
<text class="note" x="122" y="136">names</text>
<g class="signed"><rect x="250" y="170" width="150" height="56" rx="8"/>
<text class="th" x="325.0" y="189.0">License (root)</text>
<text class="ts" x="325.0" y="208.0">the right to distribute</text>
</g>
<g class="signed"><rect x="470" y="170" width="120" height="56" rx="8"/>
<text class="th" x="530.0" y="189.0">Capsule C1</text>
<text class="ts" x="530.0" y="208.0">the data of round 1</text>
</g>
<g class="signed"><rect x="640" y="170" width="120" height="56" rx="8"/>
<text class="th" x="700.0" y="189.0">Capsule C2</text>
<text class="ts" x="700.0" y="208.0">the data of round 2</text>
</g>
<g class="signed"><rect x="810" y="170" width="120" height="56" rx="8"/>
<text class="th" x="870.0" y="189.0">Capsule C3</text>
<text class="ts" x="870.0" y="208.0">the data of round 3</text>
</g>
<line x1="530" y1="106" x2="530" y2="167" class="arr" marker-end="url(#arrow)"/>
<line x1="700" y1="106" x2="700" y2="167" class="arr" marker-end="url(#arrow)"/>
<line x1="870" y1="106" x2="870" y2="167" class="arr" marker-end="url(#arrow)"/>
<text class="note" x="706" y="136">published together</text>
<g class="seen"><rect x="250" y="290" width="150" height="56" rx="8"/>
<text class="th" x="325.0" y="309.0">License L1</text>
<text class="ts" x="325.0" y="328.0">a sublicense, owned by D1</text>
</g>
<line x1="325" y1="226" x2="325" y2="287" class="arr" marker-end="url(#arrow)"/>
<text class="note" x="332" y="256">sublicense</text>
<line x1="40" y1="390" x2="960" y2="390" class="sep"/>
<text class="band" x="960" y="408" style="text-anchor: end">Below: nothing the operator is a stakeholder of</text>
<g class="hidden"><rect x="40" y="430" width="150" height="56" rx="8"/>
<text class="th" x="115.0" y="449.0">Verifier (consumer's)</text>
<text class="ts" x="115.0" y="468.0">same rules, own instance</text>
</g>
<g class="hidden"><rect x="250" y="430" width="190" height="56" rx="8"/>
<text class="th" x="345.0" y="449.0">Capsule C1′</text>
<text class="ts" x="345.0" y="468.0">round 1, for D1's clients</text>
</g>
<line x1="325" y1="346" x2="325" y2="427" class="arr" marker-end="url(#arrow)"/>
<text class="note" x="332" y="372">distribute, from C1's view</text>
<g class="ex"><rect x="470" y="430" width="220" height="56" rx="8"/>
<text class="th" x="580.0" y="449.0">The consumer verifies C1′</text>
<text class="ts" x="580.0" y="468.0">authenticity · canonicality · freshness</text>
</g>
<line x1="440" y1="458" x2="467" y2="458" class="arr" marker-end="url(#arrow)"/>
<path d="M115 486 L115 522 L580 522 L580 489" class="arr" marker-end="url(#arrow)"/>
<path d="M600 430 L600 140 L530 140 L530 109" class="view" marker-end="url(#arrow)"/>
<text class="note" x="610" y="300">round 1, as a view from</text>
<text class="note" x="610" y="316">its own participant</text>
<rect x="40" y="560" width="12" height="12" rx="2" fill="#AE0822" stroke="#950017"/><text class="note" x="58" y="566">signed by the operator, with the auditors in the reference</text>
<rect x="420" y="560" width="12" height="12" rx="2" fill="#FFE3E3" stroke="#E41939"/><text class="note" x="438" y="566">observed by the operator</text>
<rect x="660" y="560" width="12" height="12" rx="2" fill="#F7F7F7" stroke="#D9D9D9"/><text class="note" x="678" y="566">never seen by the operator</text>
</svg>
