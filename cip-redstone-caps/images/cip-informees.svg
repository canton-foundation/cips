<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="396" viewBox="0 0 1000 396" role="img">
<title>Who is informed of a publication, a distribution and a verification</title>
<desc>Three transactions of the reference implementation: what each uses, what it creates and who Canton informs. A publication informs the operator, the auditors, the readers and the licensees; a distribution by view informs the distributor and its clients only; a verification informs the consumer alone.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; dominant-baseline: central; text-anchor: middle; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; }
rect { stroke-width: 0.5; }
.signed rect { fill: #AE0822; stroke: #950017; } .signed .th { fill: #FFFFFF; } .signed .ts { fill: #FFE3E3; }
.seen rect { fill: #FFE3E3; stroke: #E41939; } .seen .th { fill: #3D0309; } .seen .ts { fill: #AE0822; }
.hidden rect { fill: #F7F7F7; stroke: #D9D9D9; } .hidden .th { fill: #3D0309; } .hidden .ts { fill: #6F6B6B; }
.ex rect { fill: none; stroke: #E41939; stroke-dasharray: 4 4; } .ex .th { fill: #AE0822; } .ex .ts { fill: #6F6B6B; }
.note { text-anchor: start; font-size: 12px; fill: #6F6B6B; }
.band { text-anchor: start; font-size: 13px; font-weight: 500; fill: #3D0309; }
.arr { stroke: #AE0822; stroke-width: 1.5; fill: none; }
.view { stroke: #AE0822; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
.sep { stroke: #BDBDBD; stroke-width: 1; stroke-dasharray: 6 4; }
.dots { font-size: 16px; fill: #AE0822; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#AE0822" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="1000" height="396" fill="#FFFFFF" stroke="none"/>
<text class="band" x="270" y="30" style="text-anchor: middle">uses</text>
<text class="band" x="555" y="30" style="text-anchor: middle">creates</text>
<text class="band" x="850" y="30" style="text-anchor: middle">who is informed</text>
<text class="band" x="40" y="84">1. Publication</text>
<text class="note" x="40" y="104">by a publisher</text>
<g class="hidden"><rect x="170" y="60" width="200" height="70" rx="8"/>
<text class="ts" x="270.0" y="86.5">the head, the canonical verifier</text>
<text class="ts" x="270.0" y="103.5">and the root license</text>
</g>
<line x1="378" y1="95" x2="404" y2="95" class="arr" marker-end="url(#arrow)"/>
<g class="hidden"><rect x="410" y="60" width="290" height="70" rx="8"/>
<text class="ts" x="555.0" y="86.5">a round, the next head</text>
<text class="ts" x="555.0" y="103.5">and the root capsule</text>
</g>
<line x1="708" y1="95" x2="734" y2="95" class="arr" marker-end="url(#arrow)"/>
<g class="signed"><rect x="740" y="60" width="220" height="70" rx="8"/>
<text class="ts" x="850.0" y="86.5">the operator, the auditors,</text>
<text class="ts" x="850.0" y="103.5">the readers, the licensees</text>
</g>
<text class="band" x="40" y="204">2. Distribution</text>
<text class="note" x="40" y="224">by a licensee D1</text>
<g class="hidden"><rect x="170" y="180" width="200" height="70" rx="8"/>
<text class="ts" x="270.0" y="206.5">its license; the source capsule</text>
<text class="ts" x="270.0" y="223.5">as a view, nothing fetched</text>
</g>
<line x1="378" y1="215" x2="404" y2="215" class="arr" marker-end="url(#arrow)"/>
<g class="hidden"><rect x="410" y="180" width="290" height="70" rx="8"/>
<text class="ts" x="555.0" y="215.0">a capsule for its clients</text>
</g>
<line x1="708" y1="215" x2="734" y2="215" class="arr" marker-end="url(#arrow)"/>
<g class="seen"><rect x="740" y="180" width="220" height="70" rx="8"/>
<text class="ts" x="850.0" y="206.5">D1 and its clients;</text>
<text class="ts" x="850.0" y="223.5">not the operator</text>
</g>
<text class="band" x="40" y="324">3. Verification</text>
<text class="note" x="40" y="344">by a consumer</text>
<g class="hidden"><rect x="170" y="300" width="200" height="70" rx="8"/>
<text class="ts" x="270.0" y="326.5">its own verifier; the capsule</text>
<text class="ts" x="270.0" y="343.5">and the round as views</text>
</g>
<line x1="378" y1="335" x2="404" y2="335" class="arr" marker-end="url(#arrow)"/>
<g class="hidden"><rect x="410" y="300" width="290" height="70" rx="8"/>
<text class="ts" x="555.0" y="335.0">nothing</text>
</g>
<line x1="708" y1="335" x2="734" y2="335" class="arr" marker-end="url(#arrow)"/>
<g class="hidden"><rect x="740" y="300" width="220" height="70" rx="8"/>
<text class="ts" x="850.0" y="335.0">the consumer alone</text>
</g>
</svg>
